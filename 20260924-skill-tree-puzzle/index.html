<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>スキルツリー・パズル</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./src/main.js"></script>
</head>
<body>
  <main class="app">
    <header class="status">
      <div class="status-heading">
        <h1 class="title">スキルツリー・パズル</h1>
        <p id="remaining-points" class="points"></p>
      </div>
      <select id="character-select" class="status-select" aria-label="キャラ"></select>
      <select id="challenge-select" class="status-select" aria-label="お題"></select>
      <p id="challenge" class="challenge"></p>
      <details id="boss-abilities" class="boss-abilities">
        <summary class="boss-abilities-summary">ボスの能力</summary>
        <p id="boss-abilities-text" class="boss-abilities-text"></p>
      </details>
      <p id="build-stats" class="build-stats"></p>
    </header>
    <svg id="tree" class="tree" role="img" aria-label="スキルツリー"></svg>
    <p id="node-description" class="node-description" aria-live="polite"></p>
    <p id="message" class="message" aria-live="polite"></p>
    <section id="sequence" class="sequence" aria-label="連戦" hidden>
      <p id="sequence-status" class="sequence-status"></p>
      <div id="sequence-enemies" class="sequence-enemies"></div>
      <button id="sequence-restart-button" class="button" type="button">1体目からやり直す</button>
    </section>
    <div class="actions">
      <button id="reset-button" class="button" type="button">全リセット</button>
      <button id="challenge-button" class="button is-primary" type="button">挑戦</button>
    </div>
    <details id="debug" class="debug" hidden>
      <summary class="debug-summary">デバッグ入力</summary>
      <textarea id="debug-text" class="debug-text" rows="3" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="能力の指定"></textarea>
      <div id="debug-buttons" class="debug-buttons"></div>
      <p id="debug-error" class="debug-error" aria-live="polite"></p>
      <div class="actions">
        <button id="debug-reset-button" class="button" type="button">初期化</button>
        <button id="debug-fight-button" class="button is-primary" type="button">この構成で戦う</button>
      </div>
    </details>
    <section id="log" class="log" aria-label="戦闘ログ" hidden>
      <p id="log-summary" class="log-summary"></p>
      <div id="log-tabs" class="log-tabs" role="tablist" aria-label="敵" hidden></div>
      <p id="log-enemy-summary" class="log-summary" hidden></p>
      <ol id="log-entries" class="log-entries"></ol>
    </section>
  </main>
</body>
</html>
